@if (documentos && documentos.length > 0) {
  <div class="space-y-3">

    @for (doc of documentos; track doc.id) {

      <div
        class="flex flex-col sm:flex-row sm:items-center sm:justify-between
              gap-4 p-4 border rounded-lg shadow-sm bg-white"
      >
        <!-- Izquierda: icono + info -->
        <div class="flex items-start sm:items-center gap-3 min-w-0">

          <fa-icon
            [icon]="getIcon(doc.extDocument)"
            class="text-2xl text-[#e2650f] shrink-0"
          ></fa-icon>

          <div class="min-w-0">
            <p
              class="font-semibold text-neutral-700 break-all sm:break-words truncate sm:truncate-none"
            >
              {{ doc.nameDocument.split('/').pop() }}{{ doc.extDocument }}
            </p>

            <p class="text-sm text-neutral-500">
              {{ doc.expedicion | date:'dd/MM/yyyy HH:mm' }}
            </p>
          </div>
        </div>

        <!-- Botones -->
        <div class="flex gap-4 self-start sm:self-auto">

          <!-- Ver -->
          <button
            type="button"
            (click)="verArchivo(doc)"
            class="flex items-center gap-2 text-[#86a41e] hover:text-[#677c1c] text-sm font-medium cursor-pointer"
          >
            <fa-icon [icon]="faEye"></fa-icon>
            Ver
          </button>

          <!-- Descargar -->
          <button
            type="button"
            (click)="descargar(doc)"
            class="flex items-center gap-2 text-[#e2650f] hover:text-orange-700 text-sm font-medium cursor-pointer"
          >
            <fa-icon [icon]="faDownload"></fa-icon>
            Descargar
          </button>

        </div>
      </div>

    }

  </div>
} @else {

  <p class="text-center text-neutral-500 italic">
    No hay anexos cargados
  </p>

}
