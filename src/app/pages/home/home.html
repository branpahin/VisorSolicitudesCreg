@if(!cargando){
<div class="login-bg min-h-screen flex items-center justify-center force-light">
    <a>
        <img class="img-fluid" src="assets/eep/logoEEP_dynamic.svg" alt="img logo login" />
    </a>

    <div class="col-md-5 mx-auto">
        <div id="first">
        <div class="myform form">
            <div class="logo mb-3 mt-8">
            <div class="col-md-12 ">
                <div class="logo-app text-center">
                
                <!-- <p-divider></p-divider> -->
                </div>
                <div class="container-info-login">
                <label class="login-title">Empresa de Energía de Pereira</label>
                <br />
                <label class="login-description">Busca tu solicitud</label>
                </div>
            </div>
            </div>

            <div class="container">
                <div class="container-info-login">
                    <div class="mb-3 row">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <label class="login-labels">Tipo Solicitud</label>
                        </div>
                        <p-select
                            [options]="cregs"
                            optionLabel="name"
                            optionValue="code"
                            [(ngModel)]="creg"
                            placeholder="Seleccione tipo de solicitud"
                            class="w-full rounded-xl">
                        </p-select>
                    </div>
                    <div class="mb-3 row">
                        <label class="mb-2 login-labels" >Número de solicitud</label>
                        <input [(ngModel)]="numeroSolicitud" class="w-full border border-[#d1d5db] rounded-lg p-2" 
                        placeholder="Numero de solicitud" />
                    </div>

                    <div class="mb-3 row">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                        <label class="login-labels">Ciudad</label>
                        </div>
                        <p-select
                            [options]="ciudades"
                            optionLabel="name"
                            optionValue="code"
                            [(ngModel)]="ciudad"
                            placeholder="Seleccione una ciudad"
                            class="w-full rounded-xl">
                        </p-select>
                    </div>

                    <div class="mb-3 row">
                        <div class="d-grid align-items-center text-center">
                            <button (click)="buscar()" class="btn btn-lg btn-block btn-login p-2 rounded-xl cursor-pointer">BUSCAR</button>
                        </div>
                    </div>

                </div>
            </div>
        </div>
        </div>
    </div>
    
</div>

}@else {<div class="min-h-screen flex flex-col items-center justify-center bg-gray-50 gap-4">

    <!-- Spinner -->
    <div
      class="w-12 h-12 border-4 border-orange-200 border-t-[#e2650f] rounded-full animate-spin">
    </div>

    <!-- Texto -->
    <span class="text-gray-600 text-sm animate-pulse">
      Buscando solicitud...
    </span>

  </div>}
<p-toast position="top-right"></p-toast>
<p-dialog 
    header="Verificación de Código"
    [(visible)]="displayCodigoDialog"
    [modal]="true"
    [closable]="false"
    [style]="{ width: '400px' }"
    [draggable]="false"
    [resizable]="false">

    <div class="text-center">
        <p>
            Hemos enviado un código al correo:
        </p>
        <strong>{{ correoEnviado }}</strong>
    </div>

    <div class="codigo-container mt-4">
        <p-inputOtp
        class="mi-otp"
  [(ngModel)]="codigo"
  [length]="6"
  [integerOnly]="true"
  (ngModelChange)="limpiarCodigo($event)"
></p-inputOtp>
    </div>

    <ng-template pTemplate="footer">
        <button pButton label="Cancelar" 
                class="p-button-text"
                (click)="cerrarDialog()"></button>

        <button pButton label="Validar"
                (click)="validarCodigo()"
                [disabled]="codigo.length !== 6">
        </button>
    </ng-template>

</p-dialog>
